<g font-family="Arial,sans-serif" fill="#111" text-anchor="middle">
<text x="500" y="36" font-size="25" font-weight="bold">AXI4-Lite to SPI Master Controller</text>
<text x="107" y="248" font-size="18">AXI master</text><text x="107" y="277" font-size="14">DE2 demo FSM</text>
<text x="320" y="236" font-size="18">AXI slave</text><text x="320" y="264" font-size="15">AW / W buffers</text><text x="320" y="290" font-size="15">Register decode, B / R</text>
<text x="555" y="108" font-size="18">Configuration</text><text x="555" y="136" font-size="15">Enable, CPOL, CPHA, D</text>
<text x="555" y="235" font-size="18">TX FIFO</text><text x="555" y="259" font-size="15">8 bytes (default)</text>
<text x="555" y="395" font-size="18">RX FIFO</text><text x="555" y="420" font-size="15">8 bytes (default)</text>
<text x="822" y="237" font-size="18">SPI FSM + datapath</text><text x="822" y="267" font-size="15">IDLE / LOAD / SHIFT / FINISH</text><text x="822" y="296" font-size="15">8-bit shifters, edge counter</text><text x="822" y="323" font-size="15">Divider, MSB-first, modes 0–3</text>
<text x="822" y="417" font-size="17">SCLK / MOSI / CS_n → pins</text><text x="822" y="446" font-size="17">MISO ← pin</text>
<text x="500" y="500" font-size="15">One system clock: 50 MHz. SPI SCLK is an output; AXI remains internal on DE2.</text>
</g>
